name: Deploy Application

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linting
        run: bun run check

      - name: Run type checking
        run: bun run typecheck

      - name: Run tests
        run: bun run test
        # currently tests are not working on CI yet as they use a real Postgres instance that's unavailable in CI
        continue-on-error: true

      - name: Build frontend
        run: bun run build:app

  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [get-infrastructure-outputs, build-and-test]

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.get-infrastructure-outputs.outputs.registry_endpoint }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.get-infrastructure-outputs.outputs.registry_endpoint }}/ws-scoring
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate-database:
    name: Migrate Database
    runs-on: ubuntu-latest
    needs: [get-infrastructure-outputs, build-docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.6.0'

      - name: Install Scaleway CLI
        run: |
          curl -o /usr/local/bin/scw -L "https://github.com/scaleway/scaleway-cli/releases/latest/download/scaleway-cli_$(uname -s)_$(uname -m)"
          chmod +x /usr/local/bin/scw

      - name: Configure Scaleway CLI
        run: |
          scw init access-key=${{ secrets.SCW_ACCESS_KEY }} \
                   secret-key=${{ secrets.SCW_SECRET_KEY }} \
                   default-project-id=${{ secrets.SCW_DEFAULT_PROJECT_ID }} \
                   default-region=${{ secrets.SCW_DEFAULT_REGION }} \
                   send-telemetry=false

      - name: Get infrastructure outputs
        working-directory: infrastructure
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="access_key=${{ secrets.SCW_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.SCW_SECRET_KEY }}" \
            -backend-config="region=${{ secrets.SCW_DEFAULT_REGION }}" \
            -backend-config="endpoint=https://s3.${{ secrets.SCW_DEFAULT_REGION }}.scw.cloud"

          echo "CONTAINER_ID=$(tofu output -raw container_id)" >> $GITHUB_ENV
          echo "DATABASE_URL=$(tofu output -raw database_url)" >> $GITHUB_ENV

      - name: Scale container to zero
        run: |
          scw container container update ${{ env.CONTAINER_ID }} \
            min-scale=0 max-scale=0

      - name: Wait for graceful shutdown
        run: sleep 10

      - name: Run database migrations
        run: |
          docker run --rm \
            -e POSTGRESQL_CONNECTION_STRING="${{ env.DATABASE_URL }}" \
            ${{ needs.get-infrastructure-outputs.outputs.registry_endpoint }}/ws-scoring:latest \
            bun run db:migrate

  deploy-container:
    name: Deploy Container
    runs-on: ubuntu-latest
    needs: [get-infrastructure-outputs, migrate-database]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.6.0'

      - name: Install Scaleway CLI
        run: |
          curl -o /usr/local/bin/scw -L "https://github.com/scaleway/scaleway-cli/releases/latest/download/scaleway-cli_$(uname -s)_$(uname -m)"
          chmod +x /usr/local/bin/scw

      - name: Configure Scaleway CLI
        run: |
          scw init access-key=${{ secrets.SCW_ACCESS_KEY }} \
                   secret-key=${{ secrets.SCW_SECRET_KEY }} \
                   default-project-id=${{ secrets.SCW_DEFAULT_PROJECT_ID }} \
                   default-region=${{ secrets.SCW_DEFAULT_REGION }} \
                   send-telemetry=false

      - name: Get container ID
        working-directory: infrastructure
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="access_key=${{ secrets.SCW_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.SCW_SECRET_KEY }}" \
            -backend-config="region=${{ secrets.SCW_DEFAULT_REGION }}" \
            -backend-config="endpoint=https://s3.${{ secrets.SCW_DEFAULT_REGION }}.scw.cloud"

          echo "CONTAINER_ID=$(tofu output -raw container_id)" >> $GITHUB_ENV
          echo "CONTAINER_URL=$(tofu output -raw container_url)" >> $GITHUB_ENV

      - name: Update container with new image
        run: |
          scw container container update ${{ env.CONTAINER_ID }} \
            registry-image=${{ needs.get-infrastructure-outputs.outputs.registry_endpoint }}/ws-scoring:latest \
            min-scale=0 max-scale=1

      - name: Display deployment info
        run: |
          echo "✅ Deployment successful!"
          echo "🚀 Application URL: ${{ env.CONTAINER_URL }}"
