services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ws-scoring-dev

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      API_PORT: 3000
      API_CORS_ALLOWED_ORIGIN: ${API_CORS_ALLOWED_ORIGIN}
      API_CORS_DEV_ORIGIN: ${API_CORS_DEV_ORIGIN}
    ports:
      - "${API_PORT}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: bun run --hot server.ts
    networks:
      - ws-scoring-dev

  vite:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      VITE_API_TARGET: http://app:3000
      VITE_DEV_PORT: 5173
    ports:
      - "${VITE_DEV_PORT}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: bun run dev:app
    depends_on:
      - app
    networks:
      - ws-scoring-dev

  mcp-dbhub:
    image: bytebase/dbhub:latest
    ports:
      - "${DBHUB_PORT}:8080"
    command:
      - --transport
      - http
      - --port
      - "8080"
      - --dsn
      - "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ws-scoring-dev

volumes:
  postgres-dev-data:

networks:
  ws-scoring-dev:
    driver: bridge
