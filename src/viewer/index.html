<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heat Viewer - Live Stream</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        background: #1a1a1a;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        margin-bottom: 2rem;
      }
      .info {
        background: #2a2a2a;
        padding: 1rem;
        border-radius: 4px;
        margin-bottom: 2rem;
      }
      .info code {
        background: #1a1a1a;
        padding: 0.2rem 0.4rem;
        border-radius: 2px;
      }
      heat-viewer {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Live Heat Viewer</h1>
      <div id="viewer-container"></div>
    </div>
    <script type="module" src="/viewer/heat-viewer.js"></script>
    <script>
      // Extract heat ID from URL path: /viewer/{heatId}
      const pathParts = window.location.pathname.split('/').filter(part => part !== '');
      const heatId = pathParts[1]; // Index 1 because index 0 is 'viewer'

      const container = document.getElementById('viewer-container');

      if (heatId && heatId.trim() !== '') {
        // Create and initialize the heat-viewer component
        const viewer = document.createElement('heat-viewer');
        viewer.setAttribute('heat-id', heatId);
        container.appendChild(viewer);
      } else {
        // Show error message if no heat ID is provided
        const errorDiv = document.createElement('div');
        errorDiv.className = 'info';
        errorDiv.style.color = '#ff6b6b';
        errorDiv.innerHTML = `
          <p><strong>Error:</strong> Heat ID is required in URL</p>
          <p>Please navigate to <code>/viewer/{heatId}</code></p>
          <p>Example: <code>/viewer/bracket-210d8667-e898-4ad5-bdcd-d6d758ca9316-2a</code></p>
        `;
        container.appendChild(errorDiv);
      }
    </script>
  </body>
</html>
